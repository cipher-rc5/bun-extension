# Extend default secret rules with repository-specific exclusions.

[extend]
useDefault = true

[allowlist]
description = "Repo-specific allowlist"

# Exclude local scratch, generated output, lockfiles, and research.
paths = [
  '''_dev/.*''',
  '''_v.*-llm\.md''',
  '''dist/.*''',
  '''bun\.lock''',
  '''research/.*''',
]

# Placeholder / documentation strings that look like secrets but are not.
regexes = [
  '''\$GITHUB_TOKEN''',
  '''<REDACTED>''',
  '''gho_your[_-]?token''',
]
