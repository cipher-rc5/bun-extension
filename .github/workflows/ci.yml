name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check source and tests
        run: bun run type-check
      - name: Lint / format check
        run: bun run lint
      - name: Unit and failure-path tests
        run: bun run test
      - name: Build extension
        run: bun run build
      - name: Install test browser
        run: bun run browser:install --with-deps
      - name: Native browser and installed-extension tests
        run: bun run test:browser
      - name: Install minimum supported Chromium
        run: bun run browser:install:compat
      - name: Test minimum supported browser
        run: bun run test:compat
      - name: Audit dependencies
        run: bun audit
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
