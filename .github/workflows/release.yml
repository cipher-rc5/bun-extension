name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Validate stable release tag and versions
        run: bun run release:check
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check source and tests
        run: bun run type-check
      - name: Lint / format check
        run: bun run lint
      - name: Unit and failure-path tests
        run: bun run test
      - name: Build extension
        run: bun run build
      - name: Install test browser
        run: bun run browser:install --with-deps
      - name: Native browser and installed-extension tests
        run: bun run test:browser
      - name: Install minimum supported Chromium
        run: bun run browser:install:compat
      - name: Test minimum supported browser
        run: bun run test:compat
      - name: Audit dependencies
        run: bun audit
      - name: Package extension
        run: bun run release:package
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          syft-version: v1.54.1
          format: cyclonedx-json
          output-file: extension-${{ github.ref_name }}.sbom.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SHA-256 checksums
        run: bun run release:checksums
      - name: Attest archive and SBOM provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ env.ZIP }}
            extension-${{ github.ref_name }}.sbom.json
      - name: Stage verification bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: bun run release:bundle
      - name: Publish verified release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
            ${{ env.ZIP }}.sigstore.json
            extension-${{ github.ref_name }}.sbom.json
